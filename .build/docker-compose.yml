services:
  wordpress:
    container_name: ${PLUGIN_NAME}_wp_test
    image: wordpress:latest
    ports:
      - "8181:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: root
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - ./build_test/${PLUGIN_NAME}:/var/www/html/wp-content/plugins/${PLUGIN_NAME}
    depends_on:
      - db

  db:
    container_name: ${PLUGIN_NAME}_db_test
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wordpress
